# IntegrityGap Configuration File
# Lines starting with # or ; are comments.
# All CLI flags are supported as configuration keys.

# Target binary (required)
/bin/ls

# Analysis mode flags
--all

# Output flags
--json report.json
--plain

# Analysis options
--fp-reduction
--enable-cvss
--enable-remediation
--verbose

# Filtering
--min-severity medium
--max-findings 100

# Caching
--cache-enabled
--cache-directory .cache/integritygap
